# 配置说明
# API_DOWNLOAD_DIR：原视频下载目录；API_PROCESSED_DIR：处理后视频目录
# PUBLIC_BASE_URL：对外访问视频的基础 URL；PORT：HTTP 服务端口
# PROCESS_TIMEOUT_SECONDS：单个任务最大处理时间（秒）；DOWNLOAD_TIMEOUT_SECONDS：下载超时时间（秒）
# FFMPEG_PATH：ffmpeg 可执行文件路径；OCR_DEVICE：PaddleOCR 运行设备，如 gpu:0/cpu
# OCR_DET_DB_THRESH：DB 检测阈值；OCR_DET_DB_BOX_THRESH：文本框置信度阈值
# OCR_DET_DB_UNCLIP_RATIO：检测框扩张比例
# OCR_FILTER_DETECTIONS：是否按 OCR 结果过滤（1 开启）；OCR_RECOGNIZE_TEXT：是否启用文字识别
# OCR_RECOGNIZE_EVERY_N_FRAMES：识别间隔；OCR_RECOGNITION_MIN_SCORE：最低识别置信度
# OCR_FILTER_WHITE_TEXT：是否只处理白色高对比度文字
# OCR_WHITE_MIN_VALUE/MAX_SATURATION：白色亮度/饱和度阈值
# OCR_WHITE_MIN_RATIO：框内白色像素比例；OCR_WHITE_MIN_CONTRAST_RATIO：对比像素比例
# OCR_MAX_TILT_DEGREES：middle.py 跳过的最大倾斜角（度）
# OCR_PORTRAIT_Y_MIN/MAX_RATIO：竖屏检测区域；OCR_LANDSCAPE_Y_MIN/MAX_RATIO：横屏检测区域
# OCR_TOP_Y_MAX_RATIO：额外顶部区域下边界，0 表示关闭
# OCR_REMOVE_MIN_Y_RATIO：按框中心高度过滤下限，0 表示关闭
# OCR_X_MIN/MAX_RATIO：检测区域左右边界；OCR_DEBUG_FILE：OCR 调试日志路径

